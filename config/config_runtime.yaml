# CLIPGCN 50/5 ZSL on the canonical 45/25/10/20 subject split.
# VPO train / val / test come from disjoint subject groups (45 / 10 / 20);
# the other 25 subjects are reserved exclusively for DQN.
# so the val loss finally measures generalisation to unseen people.
# Variant 'aug': objconcat head + feature augmentation + modality dropout
# + prototype ensembling. Base: attention_pool + temporal_concat

runtime:
  device: cuda:0
  seed: 20260616
  amp: true
  no_show: true

data:
  train:
    data_dir: ./config/class_splits/strict45_10
    prefix: trimodal_train
    pose_suffix: _coco17
    mmap: true

  # Real held-out subjects, not a random slice of the training clips.
  val:
    data_dir: ./config/class_splits/strict45_10
    prefix: trimodal_val
    pose_suffix: _coco17
    mmap: true


  # Regularisation for a 5872-clip training set that the head memorises by
  # epoch ~40 (train_acc reaches 1.0 long before the schedule ends).
  augment:
    enabled: true
    noise_std: 0.02        # gaussian jitter on the cached features
    time_jitter: 0.3       # probability of rolling the 13-frame axis by +-1
    modality_dropout: 0.2  # blank one stream; also the robot's occlusion case


  text:
    xlsx: ../ntu55_global_descriptions.xlsx
    id_column: ID
    text_column: global_description
    label_offset: 1
    prompt_template: "{global_description}"
    # Prototype ensembling: one sentence puts a class at an isolated point in
    # CLIP space, which is brittle for classes never trained on. Eight phrasings
    # per class are encoded and their unit vectors averaged.
    prompt_templates:
      - "{global_description}"
      - "{action_description}"
      - "a person {action_description}"
      - "a video of a person {action_description}"
      - "an older adult {action_description}"
      - "someone at home {action_description}"
      - "a daily activity: {action_description}"
      - "footage of {action_description} indoors"
    batch_size: 128
    cache_output: ./runtime_cache/clip_text_action_embeddings.pt

  dataloader:
    batch_size: 128
    num_workers: 12
    persistent_workers: true
    train_shuffle: true
    val_shuffle: false
    class_balanced_sampling: true
    pin_memory: true
    drop_last: true

model:
  text_encoder:
    name: ViT-B/32
    # Keep inference fully offline: this directory contains the CLIP weight
    # exported with har_export and is mounted into the deployment container.
    download_root: ../local_models/clip
  fusion:
    # reducer: attention_pool  spatial GAP + temporal attention  (~1.5M)
    #          gap             spatial GAP + temporal GAP        (~0.7M)
    #          flatten_fc      original 25200->512 projection    (~13M)
    reducer: attention_pool
    dropout: 0.4
    attention_dim: 256
    attention_heads: 4
    attention_layers: 1
    # object_fusion: cross_attention  objects are key/value, frames are query
    #                broadcast        object map repeated on every frame
    #                temporal_concat  original: object map as a 14th frame
    object_fusion: temporal_concat
    object_attention_dim: 128
    object_attention_heads: 4
    object_dropout: 0.1
    # RTMPose COCO-17: 33 video channels + 17 joints = 50
    video_channels: 33
    num_joints: 17

train:
  epochs: 300
  # Selectable objective. `cross_entropy` exactly preserves the original
  # framework; `cross_entropy_entropy` adds lambda_H * H(p(y|x)).
  loss:
    mode: cross_entropy
    entropy_weight: 0.05
    entropy_temperature: 0.1
    entropy_scope: seen       # do not explicitly repel clips from unseen prototypes
    entropy_normalize: true   # divide H by log(number of candidate classes)
    entropy_correct_only: true
    entropy_start_epoch: 10
    entropy_warmup_epochs: 20
    # Remove CLIP's learnable logit scale before H, otherwise lower entropy can
    # be achieved by changing one scalar instead of separating embeddings.
    scale_independent: true
    # Optional L2-SP preservation for checkpoint fine-tuning. Zero keeps the
    # original objective exactly unchanged.
    anchor_weight: 0.0
    anchor_scope: visual
  # Average the last third of training. The four pseudo-unseen groups show a
  # flat plateau there whose arg-max jumps between runs, so averaging it is
  # steadier than picking any single epoch.
  swa_start: 200

  val_interval: 1
  grad_clip_norm: 1.0
  # No early stopping: every variant runs the full budget so the comparison is
  # not biased towards whichever one happens to plateau first.
  scheduler: cosine
  min_lr: 1.0e-6
  # Val loss is dominated by a few hard clips and kept selecting checkpoints
  # that tested worse, so the best model is the one with the highest val top-1.
  model_selection: val_accuracy
  optimizer:
    name: AdamW
    lr: 0.0001
    weight_decay: 0.0001

outputs:
  work_dir: ./logs/recognizer
  auto_run_dir: true
  run_name: null
  best_model: ./logs/recognizer/best_model.pth
  last_model: ./logs/recognizer/last_model.pth
  history: ./logs/recognizer/history.json
  train_curve: ./logs/recognizer/train_curve.png
  test_results: ./logs/recognizer/unseen_test_results.json

inference:
  # Runtime schema consumed by VPOCLIP_rosbot/gating.py.
  decision_gate:
    enabled: true
    require_person: true
    person_slot: 0
    temperature: 0.1
    entropy_threshold: 0.55
  gating:
    enabled: true
    # YOLO sees no person -> unknown, whatever the scores say.
    require_person: true
    person_slot: 0            # class 0 of the custom50 detector is "person"
    novelty:
      method: entropy         # entropy | prototype
      temperature: 0.1        # softmax temperature the entropy is measured at
      entropy_threshold: 0.55 # above this the window is too ambiguous -> unknown
      cosine_threshold: 0.25  # below this no prototype is close enough -> unknown
    motion:
      enabled: true
      static_threshold: 0.004 # mean per-joint displacement per frame
      static_labels: [52]     # a motionless person is unknown or "fallen on the floor"
      static_cosine_threshold: 0.25
    hysteresis: 3             # agreeing windows needed before the label switches
