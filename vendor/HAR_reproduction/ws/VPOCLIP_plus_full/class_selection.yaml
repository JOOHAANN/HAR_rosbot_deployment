# CLIPGCN 55-action class selection table
# Each class has one of three states:
#   seen   - seen class (contributes samples and candidates on the seen side)
#   unseen - unseen class (contributes samples and candidates on the unseen side, for ZSL/GZSL eval)
#   off    - fully excluded (appears in neither samples nor candidates)
# After editing, run: /root/miniconda3/envs/clipgcn/bin/python tools/build_class_selection.py
# to generate data/class_selection/metadata.json for test.py --class-split-dir
# Note: label id = ID - 1 (dataset labels 0-54)
#
# !!! IMPORTANT: the unseen marker only changes the evaluation protocol, not what the model saw in training !!!
# True ZSL requires: the classes marked unseen here == the classes excluded during checkpoint training
#   Reference: the 50_5 checkpoint excludes A010 A011 A012 A018 A050 (labels 9,10,11,17,49)
# Checkpoint paired with this table: (fill in yourself; update when the table changes)
classes:
  A001: seen   # label= 0 | eating food with a fork
  A002: seen   # label= 1 | pouring water into a cup
  A003: seen   # label= 2 | taking medicine
  A004: seen   # label= 3 | drinking water
  A005: off   # label= 4 | putting food in the fridge/taking food from the fridge
  A006: off   # label= 5 | trimming vegetables
  A007: off   # label= 6 | peeling fruit
  A008: seen   # label= 7 | using a gas stove
  A009: unseen   # label= 8 | cutting vegetable on the cutting board
  A010: unseen   # label= 9 | brushing teeth
  A011: unseen   # label=10 | washing hands
  A012: seen   # label=11 | washing face
  A013: off   # label=12 | wiping face with a towel
