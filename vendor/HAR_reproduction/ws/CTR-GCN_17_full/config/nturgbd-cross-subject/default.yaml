work_dir: ./work_dir/ntu60/xsub/ctrgcn_joint_ddp_v100

# feeder
feeder: feeders.feeder_ntu.Feeder
train_feeder_args:
  data_path: data/ntu/NTU60_CS.npz
  split: train
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: 64
  normalization: False
  random_rot: True
  p_interval: [0.5, 1]
  vel: False
  bone: False

test_feeder_args:
  data_path: data/ntu/NTU60_CS.npz
  split: test
  window_size: 64
  p_interval: [0.95]
  vel: False
  bone: False
  debug: False

# model
model: model.ctrgcn.Model
model_args:
  num_class: 60
  num_point: 25
  num_person: 2
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'spatial'

#optim
weight_decay: 0.0004
base_lr: 0.1
lr_decay_rate: 0.1
step: [35, 55]
warm_up_epoch: 5
amp: True
cudnn_benchmark: True
cudnn_deterministic: False

# training
num_worker: 48
device: [0]
batch_size: 128
test_batch_size: 128
num_worker: 0
pin_memory: False
persistent_workers: False
prefetch_factor: 1
eval_interval: 5
num_epoch: 65
nesterov: True
