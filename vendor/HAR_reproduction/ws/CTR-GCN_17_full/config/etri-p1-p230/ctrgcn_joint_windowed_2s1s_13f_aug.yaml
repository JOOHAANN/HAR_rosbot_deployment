work_dir: ./work_dir/etri_p1_p230_windowed_2s1s_13f_aug/xsub/ctrgcn_joint

# feeder
feeder: feeders.feeder_ntu.Feeder
train_feeder_args:
  data_path: /workspace/CLIPGCN/data/windowed_2s1s_13f/windowed_skeleton_uniform13.npz
  split: train
  debug: False
  random_choose: False
  random_shift: True
  random_move: True
  window_size: 13
  normalization: False
  random_rot: True
  random_flip: True
  noise_std: 0.01
  p_interval: [1]
  vel: False
  bone: False

test_feeder_args:
  data_path: /workspace/CLIPGCN/data/windowed_2s1s_13f/windowed_skeleton_uniform13.npz
  split: test
  window_size: 13
  p_interval: [1]
  vel: False
  bone: False
  debug: False

# model
model: model.ctrgcn.Model
model_args:
  num_class: 55
  num_point: 25
  num_person: 2
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'spatial'

# optim
weight_decay: 0.0008
base_lr: 0.1
lr_decay_rate: 0.1
step: [35, 55]
warm_up_epoch: 5
amp: True
cudnn_benchmark: True
cudnn_deterministic: False

# training
device: [0]
batch_size: 128
test_batch_size: 128
num_worker: 8
pin_memory: True
persistent_workers: True
prefetch_factor: 2
eval_interval: 5
num_epoch: 65
nesterov: True
